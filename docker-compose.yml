services:
  agent-browser:
    image: ghcr.io/gaxxx/bsession:latest
    build: .
    container_name: agent-browser
    ports:
      - "5900:5900"   # VNC
      - "6080:6080"   # noVNC web
      - "${BSESSION_API_PORT:-18000}:${BSESSION_API_PORT:-18000}" # bsession API
    volumes:
      - ${BSESSION_WORKSPACE:-${HOME}/.bsession/workspace}:/workspace
    env_file:
      - .env
    environment:
      - DISPLAY=:99
      # Pass the API port through so api.py inside the container matches the
      # published port mapping above (both default to 18000).
      - BSESSION_API_PORT
      # Seconds of idleness before the reaper closes a profile's Chrome
      # (cookies persist on disk; relaunched on next use). 0 disables.
      - BSESSION_IDLE_TTL
    shm_size: 1gb
    networks:
      - bsession
    restart: unless-stopped

networks:
  bsession:
    name: bsession
    driver: bridge
