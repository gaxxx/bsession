services:
  agent-browser:
    image: ghcr.io/gaxxx/bsession:latest
    build: .
    container_name: agent-browser
    ports:
      - "5900:5900"   # VNC
      - "6080:6080"   # noVNC web
      - "${BSESSION_API_PORT:-18000}:${BSESSION_API_PORT:-18000}" # bsession API
    volumes:
      - ${BSESSION_WORKSPACE:-${HOME}/.bsession/workspace}:/workspace
    env_file:
      - .env
    environment:
      - DISPLAY=:99
    shm_size: 1gb
    networks:
      - bsession
    restart: unless-stopped

networks:
  bsession:
    name: bsession
    driver: bridge
